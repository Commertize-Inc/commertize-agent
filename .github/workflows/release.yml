# Publishes @commertize/agent (npm) and commertize-agent (PyPI) from a v* tag.
# Tags are cut by the maintainer only. Both publish jobs run in the `release`
# environment, which requires the maintainer's approval. No registry secret is
# stored: npm and PyPI both use trusted publishing (OIDC).
#
# npm: trusted publishing can only be configured on a package that already
# exists, so the FIRST npm publish is done by hand by the maintainer, with
# 2FA. The npm job skips a version that
# is already on npm, so tag v0.1.0 publishes PyPI only; from 0.1.1 on, npm
# publishes here through the trusted publisher.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Tag matches both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          js=$(node -p "require('./packages/js/package.json').version")
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/python/pyproject.toml)
          echo "tag=$v js=$js py=$py"
          test "$v" = "$js" && test "$v" = "$py"
      - name: Parity and copy guard
        run: node --test scripts/parity.test.mjs scripts/copy_guard.test.mjs

  npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Publish unless this version is already on npm (the first one is published by hand)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if npm view "@commertize/agent@${TAG#v}" version >/dev/null 2>&1; then
            echo "@commertize/agent@${TAG#v} is already on npm; nothing to publish"
          else
            npm publish --provenance --access public
          fi

  pypi-build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -I -B packages/python/run_tests.py
      - run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - run: python -m build packages/python --outdir dist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/

  pypi:
    needs: pypi-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
